<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ===== Primary SEO ===== -->
    <title>SpotMyAd — Sri Lanka’s All-in-One Classifieds for Students & Everyone</title>
    <meta name="description" content="SpotMyAd is Sri Lanka’s smart marketplace to post and discover classifieds: assignments & tuition, part-time jobs, services, rentals, electronics, vehicles, and more. Built for university students and everyone across all districts." />
    <meta name="keywords" content="SpotMyAd, Sri Lanka classifieds, Sri Lanka ads, student assignments, assignment help Sri Lanka, tuition classes, part-time jobs Sri Lanka, services Sri Lanka, buy and sell Sri Lanka, rentals apartments rooms boarding, electronics phones laptops, vehicles cars bikes, freelance gigs, find work Sri Lanka, blackcodedev, Western Province, Central, Southern, Northern, Eastern, North Western, North Central, Uva, Sabaragamuwa, Colombo Kandy Galle Jaffna Batticaloa Anuradhapura Kurunegala Ratnapura Badulla Matara Gampaha Kalutara Matale Nuwara Eliya Hambantota Trincomalee Mannar Vavuniya Mullaitivu Kilinochchi Polonnaruwa Puttalam Monaragala Kegalle" />
    <meta name="author" content="BlackCode Devs" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#007BFF" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Canonical: use subdomain first; switch to https://spotmyad.com when ready -->
    <link rel="canonical" href="https://spotmyad.blackcodedev.com/" />
<link rel="sitemap" type="application/xml" href="https://spotmyad.blackcodedev.com/sitemap.xml" />

    <!-- Hreflang (English default; Sinhala & Tamil alternates if you localize routes) -->
    <link rel="alternate" href="https://spotmyad.blackcodedev.com/" hreflang="en-lk" />
    <link rel="alternate" href="https://spotmyad.blackcodedev.com/si" hreflang="si-lk" />
    <link rel="alternate" href="https://spotmyad.blackcodedev.com/ta" hreflang="ta-lk" />
    <link rel="alternate" href="https://spotmyad.blackcodedev.com/" hreflang="x-default" />

    <!-- ===== Open Graph (Facebook/LinkedIn/WhatsApp) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SpotMyAd — Sri Lanka’s All-in-One Classifieds for Students & Everyone" />
    <meta property="og:description" content="Post & discover ads across Sri Lanka: assignments, tuition, jobs, services, rentals, electronics, vehicles, more. Free to list; fast to find." />
    <meta property="og:url" content="https://spotmyad.blackcodedev.com/" />
    <meta property="og:site_name" content="SpotMyAd" />
    <meta property="og:locale" content="en_LK" />
    <!-- Put a real social share image in /public/og-cover.jpg (1200x630) -->
    <meta property="og:image" content="%PUBLIC_URL%/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpotMyAd — Sri Lanka’s All-in-One Classifieds" />
    <meta name="twitter:description" content="Buy, sell, hire, or find help—assignments, tuition, part-time jobs, services, rentals, electronics, vehicles, more." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-cover.jpg" />

    <!-- ===== App Icons / PWA ===== -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ===== Preconnect (fonts/CDNs you actually use) ===== -->
    <!-- Example for Google Fonts: uncomment if you load fonts from Google -->
    <!--
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    -->

    <!-- ===== Sitemap & Robots ===== -->
    <!-- Generate these in production -->
    <link rel="sitemap" type="application/xml" href="https://spotmyad.blackcodedev.com/sitemap.xml" />
    <!-- robots.txt should live at /public/robots.txt -->

    <!-- ===== Ownership Verifications (optional) ===== -->
    <!-- <meta name="google-site-verification" content="YOUR_TOKEN_HERE" /> -->

    <!-- ===== Organization JSON-LD ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SpotMyAd",
      "url": "https://spotmyad.blackcodedev.com/",
      "logo": "https://spotmyad.blackcodedev.com/logo192.png",
      "sameAs": [
        "https://www.facebook.com/spotmyad",
        "https://www.instagram.com/spotmyad",
        "https://www.linkedin.com/company/spotmyad"
      ],
      "parentOrganization": {
        "@type": "Organization",
        "name": "BlackCode Devs",
        "url": "https://www.blackcodedev.com"
      }
    }
    </script>

    <!-- ===== WebSite JSON-LD with SearchAction ===== -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebSite",
      "name":"SpotMyAd",
      "url":"https://spotmyad.blackcodedev.com/",
      "potentialAction":{
        "@type":"SearchAction",
        "target":"https://spotmyad.blackcodedev.com/search?q={query}",
        "query-input":"required name=query"
      }
    }
    </script>

    <!-- ===== FAQ JSON-LD (helps SEO for common intents) ===== -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"FAQPage",
      "mainEntity":[
        {
          "@type":"Question",
          "name":"Who can post on SpotMyAd?",
          "acceptedAnswer":{"@type":"Answer","text":"University students and anyone in Sri Lanka can post assignments, tuition, services, jobs, rentals, electronics, vehicles, and more."}
        },
        {
          "@type":"Question",
          "name":"Is posting free?",
          "acceptedAnswer":{"@type":"Answer","text":"Basic ads are free. Optional featured placements are available for more visibility."}
        },
        {
          "@type":"Question",
          "name":"Which areas are covered?",
          "acceptedAnswer":{"@type":"Answer","text":"SpotMyAd covers all districts island-wide including Colombo, Kandy, Galle, Jaffna, Batticaloa, Kurunegala, Anuradhapura, Ratnapura, Badulla, and more."}
        },
        {
          "@type":"Question",
          "name":"Which languages are supported?",
          "acceptedAnswer":{"@type":"Answer","text":"English, Sinhala, and Tamil content is supported."}
        },
        {
          "@type":"Question",
          "name":"What categories are available?",
          "acceptedAnswer":{"@type":"Answer","text":"Assignments & tuition, part-time/freelance jobs, services (IT, design, repairs), rentals (rooms, apartments), electronics, phones, laptops, vehicles, and others."}
        }
      ]
    }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
